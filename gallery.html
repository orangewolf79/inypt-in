<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
  <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous">&#8249;</button>
  <img src="" alt="">
  <button class="lightbox-nav lightbox-next" type="button" aria-label="Next">&#8250;</button>
</div>

<script>
  (function () {
    var box = document.getElementById('lightbox');
    if (!box) return;
    var boxImg = box.querySelector('img');
    var imgs = Array.prototype.slice.call(document.querySelectorAll('.gallery .photo img'));
    var idx = 0;
    function show(i) {
      idx = (i + imgs.length) % imgs.length;
      boxImg.src = imgs[idx].src;
      boxImg.alt = imgs[idx].alt || '';
    }
    function open(i) {
      show(i);
      box.classList.add('open');
      box.setAttribute('aria-hidden', 'false');
    }
    function close() {
      box.classList.remove('open');
      box.setAttribute('aria-hidden', 'true');
      boxImg.src = '';
    }
    imgs.forEach(function (img, i) {
      img.addEventListener('click', function () { open(i); });
    });
    box.querySelector('.lightbox-prev').addEventListener('click', function (e) { e.stopPropagation(); show(idx - 1); });
    box.querySelector('.lightbox-next').addEventListener('click', function (e) { e.stopPropagation(); show(idx + 1); });
    box.addEventListener('click', function (e) {
      if (e.target === box || e.target.classList.contains('lightbox-close')) close();
    });
    document.addEventListener('keydown', function (e) {
      if (!box.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      else if (e.key === 'ArrowLeft') show(idx - 1);
      else if (e.key === 'ArrowRight') show(idx + 1);
    });
  })();
</script>
